aid: georgia-institute-of-technology
name: Georgia Institute of Technology
x-type: university
x-category: Institute of Technology
description: >-
  Georgia Institute of Technology (Georgia Tech) is a public technological research university in
  Atlanta, Georgia, United States. Its programmable footprint is real but small, decentralized, and
  operated by individual units rather than by any central API program: there is no developer portal,
  no self-service key issuance, and no published OpenAPI anywhere on a gatech.edu host that Georgia
  Tech itself indexes. What does exist, and what was verified live on 2026-09-01, is four
  institution-operated machine surfaces — an OAI-PMH 2.0 provider and a DSpace 7.6 REST API on
  repository.gatech.edu (the Georgia Tech Digital Repository), a Shibboleth SAML 2.0 identity
  provider registered in InCommon and scoped gatech.edu, and a CourseLeaf course-data endpoint on
  catalog.gatech.edu — plus two contracts Georgia Tech units publish as documents: the SUMS
  (Shared User Management System) Swagger on sums.gatech.edu and the RNOC GT Places API Swagger on
  rnoc.gatech.edu. Georgia Tech is a DataCite direct member (symbol GT, prefix 10.35090) and is
  registered in ROR as 01zkghx44. Two things the profile has to say plainly: GT Places is documented
  as "open to all" but its declared host now answers with a Microsoft Entra ID sign-in redirect, and
  the enterprise integration API BuzzAPI (api.gatech.edu) lost its public documentation when
  webmasters.gatech.edu was rebuilt in 2026, so it is a credentialed surface with nothing public left
  to read.
