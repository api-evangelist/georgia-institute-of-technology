x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated machine surfaces were verified live on 2026-09-01 — an OAI-PMH 2.0
    provider and a DSpace 7.6 REST API on repository.gatech.edu, a Shibboleth SAML 2.0 identity
    provider registered in InCommon and scoped gatech.edu, and a CourseLeaf course-data endpoint on
    catalog.gatech.edu returning 158 KB of XML — plus two Georgia-Tech-published contracts: the SUMS
    Swagger on sums.gatech.edu (already held) and the RNOC GT Places Swagger, newly harvested from
    rnoc.gatech.edu. Five education-regime domain standards are evidenced from public endpoints
    (oai-pmh, shibboleth, saml, orcid, datacite); crossref, scim, lti, oneroster, ed-fi, caliper and
    qti are recorded as negative with the probe that established each. No vendor contract is
    attributed to Georgia Tech: the Canvas LMS is recorded as an Instructure tenancy and no
    Instructure spec is saved, DSpace's product contract is left to DSpace, and CourseLeaf's to
    Leepfrog. Two honest negatives dominate the shape of this profile. GT Places is documented by
    RNOC as "open to all" yet its declared host m.gatech.edu now returns a Microsoft Entra ID
    sign-in page to every request, so a contract that reads as public describes a deployment that is
    not. And BuzzAPI, the institution's actual enterprise API, lost all public documentation when
    webmasters.gatech.edu was rebuilt in 2026 — both handbook URLs now 404 and the site's search is
    access-denied to anonymous users — so the two dead pointers were removed rather than left
    standing. There is no central developer portal, no self-service key issuance, no llms.txt and no
    security.txt anywhere on gatech.edu.
