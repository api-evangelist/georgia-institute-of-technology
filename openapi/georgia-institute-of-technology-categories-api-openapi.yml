          description: List of all gtplaces categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/categories'
            text/html:
              schema:
                $ref: '#/components/schemas/categories'
      summary: Get gtplaces categories
      x-summary-source: derived
      operationId: getGtplacesCategories
      x-operation-id-source: derived
components:
  schemas:
    categories:
      type: array
      items:
        type: string
