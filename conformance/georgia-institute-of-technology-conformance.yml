generated: '2026-09-01'
method: probed
source: >-
  Live probes of Georgia Institute of Technology institution-operated hosts on 2026-09-01, plus the
  InCommon per-entity metadata service (mdq.incommon.org), the DataCite REST API, the Crossref REST
  API and the ROR API.
docs: https://repository.gatech.edu/
note: >-
  Conformance against the Kin Score `education` regime standards[]. Every entry below was reached by
  fetching the named URL and reading the response body — none is a prose claim from a university web
  page. Standards Georgia Tech does not publicly expose are recorded as conforms:false with the
  negative probe that established it, and are never inferred from the presence of a vendor product.
  The OAI-PMH provider, the DSpace REST API, the Shibboleth IdP, the ORCID member integration and the
  DataCite prefix are all institution-operated on gatech.edu hosts. The Canvas (Instructure) LMS at
  gatech.instructure.com is a tenant deployment and was deliberately NOT used as conformance evidence
  for this institution.
standards:
- id: oai-pmh
  conforms: true
  operator: institution
  evidence: >-
    Live OAI-PMH 2.0 provider on the institution's own host.
    https://repository.gatech.edu/server/oai/request?verb=Identify returns 200 text/xml with
    repositoryName "Georgia Tech Digital Repository", baseURL
    https://repository.gatech.edu/server/oai/request, protocolVersion 2.0, adminEmail
    repository@library.gatech.edu, earliestDatestamp 2004-07-21T19:26:51Z, granularity
    YYYY-MM-DDThh:mm:ssZ, deletedRecord transient, and oai-identifier repositoryIdentifier
    repository.gatech.edu with sampleIdentifier oai:repository.gatech.edu:1853/1234.
    verb=ListMetadataFormats returns 200 with twelve prefixes — oai_dc, qdc, mods, mets, didl, ore,
    rdf, marc, xoai, dim, etdms and uketd_dc. verb=ListSets returns 200 (5,032 bytes) enumerating
    community and collection sets.
- id: shibboleth
  conforms: true
  operator: institution
  evidence: >-
    Shibboleth Identity Provider registered in InCommon. The per-entity metadata service
    https://mdq.incommon.org/entities/https%3A%2F%2Fidp.gatech.edu%2Fidp%2Fshibboleth returns 200
    application/samlmetadata+xml (9,062 bytes) with a signed EntityDescriptor for
    entityID="https://idp.gatech.edu/idp/shibboleth", mdui:DisplayName "Georgia Institute of
    Technology", validUntil 2026-09-15T15:37:07Z, an IDPSSODescriptor and an
    AttributeAuthorityDescriptor, and shibmd:Scope gatech.edu. The IdP also publishes its own
    metadata directly at https://idp.gatech.edu/idp/shibboleth (200 text/xml). The Redirect/SSO
    endpoint https://idp.gatech.edu/idp/profile/SAML2/Redirect/SSO returns 400 to a parameterless
    GET, which is a live Shibboleth IdP rejecting a malformed AuthnRequest.
- id: saml
  conforms: true
  operator: institution
  evidence: >-
    SAML 2.0 in the same InCommon metadata. protocolSupportEnumeration on the IDPSSODescriptor is
    "urn:mace:shibboleth:1.0 urn:oasis:names:tc:SAML:1.1:protocol urn:oasis:names:tc:SAML:2.0:protocol";
    SingleSignOnService endpoints are bound at urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
    (https://idp.gatech.edu/idp/profile/SAML2/POST/SSO), HTTP-Redirect
    (https://idp.gatech.edu/idp/profile/SAML2/Redirect/SSO) and the legacy
    urn:mace:shibboleth:1.0:profiles:AuthnRequest (https://idp.gatech.edu/idp/profile/Shibboleth/SSO).
    A separate CAS service, https://sso.gatech.edu/cas/login, returns 200 alongside it.
- id: orcid
  conforms: true
  operator: institution
  evidence: >-
    The institution-hosted DSpace 7.6 exposes its ORCID member integration configuration publicly at
    https://repository.gatech.edu/server/api/config/properties/orcid.application-client-id (200,
    application/hal+json), returning client id APP-EUNPOZFEUA8YWKV7. The repository root
    https://repository.gatech.edu/server/api reports dspaceName "Georgia Tech Digital Repository"
    and dspaceVersion "DSpace 7.6".
- id: datacite
  conforms: true
  operator: institution
  evidence: >-
    DataCite direct member. https://api.datacite.org/providers/gt returns symbol GT, name "Georgia
    Institute of Technology", memberType direct_member, rorId https://ror.org/01zkghx44, created
    2020-06-22. https://api.datacite.org/clients?provider-id=gt returns exactly one repository,
    gt.ir "Georgia Tech Digital Repository" (url https://repository.gatech.edu/).
    https://api.datacite.org/prefixes?client-id=gt.ir returns prefix 10.35090, and
    https://api.datacite.org/dois?prefix=10.35090 reports 463 DOIs whose target URLs resolve into
    the institution's own repository (e.g. 10.35090/gatech/13352 ->
    https://repository.gatech.edu/handle/1853/81874), i.e. the DOIs are minted against a
    Georgia Tech host, not a vendor host.
- id: crossref
  conforms: false
  operator: none
  evidence: >-
    https://api.crossref.org/members?query=georgia+institute+of+technology returns 200 with
    total-results 0 — no Crossref member record for the institution. No Crossref DOI prefix is
    asserted on any gatech.edu host; scholarly DOIs are minted through DataCite (above).
- id: scim
  conforms: false
  operator: none
  evidence: >-
    No SCIM 2.0 service provider configuration is publicly reachable. scim.gatech.edu does not
    resolve in DNS, and the enterprise integration API at https://api.gatech.edu/apiv3/ returns 404
    application/json without credentials, so identity provisioning is entirely behind authentication.
- id: lti
  conforms: false
  operator: vendor-gated
  evidence: >-
    No publicly reachable LTI 1.3 platform configuration or JWKS on a gatech.edu host. The LMS is
    Canvas at https://gatech.instructure.com/ (200, title "GT | GT Login") and
    https://canvas.gatech.edu/ (200), both behind GT SSO, so any LTI conformance belongs to
    Instructure's deployment and is not attributable to the institution from the public surface.
- id: oneroster
  conforms: false
  operator: none
  evidence: No 1EdTech OneRoster endpoint or roster export is published on any public gatech.edu host.
- id: ed-fi
  conforms: false
  operator: none
  evidence: >-
    Ed-Fi is a US K-12 / state-education-agency data standard and has no deployment at a higher
    education institution of this type. No Ed-Fi ODS endpoint found on any gatech.edu host.
- id: caliper
  conforms: false
  operator: none
  evidence: No 1EdTech Caliper Analytics event store or sensor endpoint is publicly exposed.
- id: qti
  conforms: false
  operator: none
  evidence: >-
    No QTI item bank or QTI content package is served from a public gatech.edu host; assessment
    content sits inside the SSO-gated Canvas LMS.
